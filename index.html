<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version Control Lab</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 70%;
            margin: 100px auto;
            padding: 40px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #24292f;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #24292f;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .btn:hover {
            background-color: #0969da;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Version Control Lab</h1>

        <p>
            Welcome to my Git and GitHub project.
        </p>

        <p>
            This project demonstrates version control using Git
            and remote repository management using GitHub.
        </p>

        <a href="#" class="btn">My Project</a>
    </div>

</body>
</html>
